<!DOCTYPE html>
<html>
<head>
    <title>Submit Assignment</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- HEADER -->
<div class="top-header">
    <div class="title">Online Assignment Tracker</div>
    <div class="subtitle">Submit Your Work</div>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="submit.html">Submit</a>
    </div>
</div>

<h1 class="page-title" style="text-align:center;">Submit Assignment</h1>

<div class="form-container">

    <form onsubmit="return submitForm()">

        <input type="text" placeholder="Assignment Name" required>
        <input type="url" placeholder="GitHub PR Link" required>
        <input type="text" placeholder="Roll Number" required>

        <button class="btn" type="submit">Submit</button>

    </form>

</div>

<script>
function submitForm(){
    alert("Assignment Submitted Successfully!");
    window.location.href = "dashboard.html";
    return false;
}
</script>

</body>
</html>
